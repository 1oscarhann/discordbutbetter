[package]
name = "dbb-desktop"
version = "0.1.0"
description = "Desktop shell for a self-hosted chat server"
edition = "2021"
rust-version = "1.90"
publish = false

[lib]
name = "dbb_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Linux only: WebKitGTK ships with WebRTC turned off, so we switch it on (voice/video need it).
# Must be the same major version wry uses.
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = { version = "2.0.2", features = ["v2_38"] }
