# Full stack: app + Postgres + Valkey + LiveKit (voice/video) + Caddy (HTTPS).
#   cp .env.example .env   # then fill it in
#   docker compose up -d
name: haunt

services:
  app:
    build: .
    image: haunt:local
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_URL: postgres://haunt:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/haunt
      REDIS_URL: redis://valkey:6379
      PUBLIC_URL: ${PUBLIC_URL:-https://${DOMAIN:?set DOMAIN in .env}}
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://${DOMAIN}/livekit}
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      STORAGE_PATH: /data/files
      # exactly one proxy (Caddy) sits in front of the app
      TRUST_PROXY: "1"
    volumes:
      - files:/data
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: haunt
      POSTGRES_DB: haunt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haunt -d haunt"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 128mb

  valkey:
    image: valkey/valkey:9.1-alpine
    restart: unless-stopped
    # presence, rate limits, caches and live activities; a snapshot every 5 min is plenty
    command: ["valkey-server", "--save", "300", "1", "--appendonly", "no"]
    volumes:
      - valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  livekit:
    image: livekit/livekit-server:v1.13.3
    restart: unless-stopped
    environment:
      # whole config inline so the API key/secret live only in .env
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: warn
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-true}
        keys:
          ${LIVEKIT_API_KEY:?set LIVEKIT_API_KEY in .env}: ${LIVEKIT_API_SECRET:?set LIVEKIT_API_SECRET in .env}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://app:3000/api/livekit/webhook
        room:
          empty_timeout: 60
    ports:
      # media goes straight to LiveKit, not through Caddy: open these on your firewall/router
      - "7881:7881/tcp"
      - "50000-50100:50000-50100/udp"

  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
      - livekit

volumes:
  files:
  postgres:
  valkey:
  caddy-data:
  caddy-config:
